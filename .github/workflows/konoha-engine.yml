name: ⚙️ Kono-Ha Build Engine
on:
  workflow_call:
    inputs:
      hz: { required: true, type: string }
      variant: { required: true, type: string }
      ksu_flavor: { required: true, type: string }
      kpm: { required: true, type: boolean }
      hardened: { required: true, type: boolean }

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Build Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm-dev libssl-dev ccache libelf-dev rsync python3 git-lfs

      - name: 🛠️ Patching Mechanic (Root & Features)
        run: |
          # Cari folder root kernel (msm-kernel/common)
          KROOT=$(find . -name "drivers" -type d | grep -E "common|msm-kernel" | head -n 1 | xargs dirname)
          cd $KROOT
          
          FLAVOR="${{ inputs.ksu_flavor }}"
          
          # Logika Suntik Root - Termasuk WildKSU
          case "$FLAVOR" in
            "official")
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main ;;
            "ksu-next")
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main ;;
            "wild-ksu")
              curl -LSs "https://raw.githubusercontent.com/Wild-KSU/WildKSU/main/kernel/setup.sh" | bash -s main ;;
            "sukisu"|"resukisu"|"mambosu")
              echo "Applying $FLAVOR patch from your internal mechanic..." ;;
          esac

          # Fix Kconfig (Menjaga agar tidak recursive dependency)
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: 🚀 Executing Bazel Build (Miro/Sun)
        run: |
          # Pindah ke folder platform sesuai struktur repo kamu
          cd kernel_platform
          chmod +x build/android/prepare_vendor.sh
          chmod +x build/build_sun.sh
          
          ./build/android/prepare_vendor.sh sun
          
          # Logika LTO & KPM sesuai mekanik build.yml asli kamu
          LTO_MODE=${{ inputs.kpm && 'thin' || 'full' }}
          
          # Eksekusi build_sun.sh dengan parameter input
          LTO=$LTO_MODE HZ=${{ inputs.hz }} ./build/build_sun.sh
          
      - name: 📦 Finishing Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Cari Image di folder out Kleaf
          IMAGE=$(find out -name "Image" | head -n 1)
          cp "$IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 "../Kono-Ha-${{ inputs.variant }}-${{ inputs.ksu_flavor }}-${{ inputs.hz }}hz.zip" .
          
      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kono-Ha-${{ inputs.ksu_flavor }}-${{ inputs.hz }}hz
          path: "*.zip"
