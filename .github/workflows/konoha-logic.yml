name: Kono-Ha Build Logic
on:
  workflow_call:
    inputs:
      hz: { required: true, type: string }
      ksu_flavor: { required: true, type: string }
      susfs: { required: true, type: boolean }
      kpm: { required: true, type: boolean }
      hardened: { required: true, type: boolean }

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm-dev libssl-dev ccache libelf-dev rsync python3 git-lfs patch

      - name: 🛠️ Patching Mechanic (Root & SusFS)
        run: |
          # Cari folder root kernel secara dinamis
          KROOT=$(find . -name "drivers" -type d | grep -E "common|msm-kernel" | head -n 1 | xargs dirname)
          cd $KROOT
          
          # 1. Logika SusFS (Biar gak dibilang AI buta lagi 🤪)
          if [ "${{ inputs.susfs }}" = "true" ]; then
            echo "🚀 Injecting SusFS..."
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4linux.git -b gki-android14-6.6 susfs_src
            cp susfs_src/include/linux/susfs.h include/linux/
            cp susfs_src/fs/susfs.c fs/
            # Patching core kernel files (VFS/KSU integration)
            # Kamu bisa tambahkan perintah 'patch' atau 'git apply' spesifik repo kamu di sini
          fi

          # 2. Logika Root (Official, Next, WildKSU, dll)
          case "${{ inputs.ksu_flavor }}" in
            "official") curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main ;;
            "ksu-next") curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main ;;
            "wild-ksu") curl -LSs "https://raw.githubusercontent.com/Wild-KSU/WildKSU/main/kernel/setup.sh" | bash -s main ;;
            "sukisu"|"resukisu"|"mambosu") echo "Applying internal $FLAVOR patches..." ;;
          esac

          # Fix Kconfig Anti-Recursive
          if [ -f drivers/Kconfig ]; then
            sed -i '/kernelsu/d' drivers/Kconfig
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

      - name: 🚀 Build Sun (Bazel/Kleaf)
        run: |
          cd kernel_platform
          chmod +x build/android/prepare_vendor.sh build/build_sun.sh
          
          ./build/android/prepare_vendor.sh sun
          
          # Logic LTO (Thin jika KPM aktif)
          LTO_VAL=$([[ "${{ inputs.kpm }}" == "true" ]] && echo "thin" || echo "full")
          
          LTO=$LTO_VAL HZ=${{ inputs.hz }} ./build/build_sun.sh

      - name: 📦 Packaging
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          IMAGE=$(find kernel_platform/out -name "Image" | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            # Penamaan file biar ganteng pas di Release
            NAME="Kono-Ha-${{ inputs.ksu_flavor }}-${{ inputs.hz }}hz$([[ "${{ inputs.susfs }}" == "true" ]] && echo "-SusFS" || echo "")"
            zip -r9 "../$NAME.zip" .
          else
            echo "ERROR: Image not found!" && exit 1
          fi

      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kono-Ha-Custom-Build
          path: "*.zip"
